services:
  db:
    image: postgres:16
    container_name: litecrm-db
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_dev_password
      POSTGRES_DB: litecrm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时自动建 pg_trgm 扩展（规格 §7.3 查重检索依赖）
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d litecrm']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
